# 마커 맵 - 벽에 붙인 ArUco 마커의 맵 좌표
#
# 좌표계 정의 (실측하기 전에 팀에서 합의하고 여기에 적어둘 것)
#   원점 : <예: 실험실 출입문 안쪽 모서리 바닥>
#   +x   : <예: 창문 쪽>
#   +y   : +x 에서 반시계 90도 (ROS 규약, 왼쪽)
#   +z   : 위
#
# 각 항목
#   id       : ArUco ID (DICT_5X5_50)
#   x, y, z  : 마커 '중심'의 맵 좌표 [m]  (모서리 아님)
#   yaw_deg  : 마커가 바라보는 방향(벽에서 바깥으로 나오는 법선)을
#              맵 +x축 기준 반시계 각도로 [deg]
#              벽이 x=0 에 있고 마커가 +x 쪽 방을 향하면 0
#              벽이 x=max 에 있고 마커가 -x 쪽을 향하면 180
#   roll_deg : 마커가 기울어져 붙은 경우 법선축 기준 회전 [deg] (보통 0)
#   size     : 검은 정사각형 외곽 한 변 [m] - 인쇄물 실측값을 넣을 것
#              150mm -> 0.150
#   note     : 설치 위치 메모

frame_id: map


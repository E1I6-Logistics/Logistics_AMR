ekf_filter_node:
  ros__parameters:
    # frequency: 30.0
    frequency: 20.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    publish_acceleration: false

    # -------------------------------------------------------------
    # 1. 휠 오도메트리 (raw wheel odometry)
    # -------------------------------------------------------------
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 2
    odom0_differential: false
    odom0_relative: false

    # -------------------------------------------------------------
    # 2. IMU 데이터
    # -------------------------------------------------------------
    imu0: /imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 2
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false